name: Release TCPORTAL Image
run-name: ${{ inputs.release_type == 'Snapshot' && 'Publish Pre-release' || format('Release {0}', inputs.release_type)}} Docker Image by @${{ github.actor }}  
on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: 'The type of release'
        options:
        - Major
        - Minor
        - Patch
        - Snapshot

jobs:
  # Release gate: nothing is versioned or published unless the tests pass. The publish jobs build the
  # triggering commit (no git_tag_or_hash), which is the commit this job checks out.
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn test --ci --json --outputFile=jest-results.json
      - name: Record test evidence
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          {
            echo "## Release tests passed"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Release type | ${RELEASE_TYPE} |"
            echo "| Tests | $(jq -r '"\(.numPassedTests) of \(.numTotalTests) passed in \(.numTotalTestSuites) suites"' jest-results.json) |"
            echo "| Run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

  incrementVersionNumber:
    uses: IABTechLab/uid2-shared-actions/.github/workflows/shared-increase-version-number.yaml@v3
    needs: test
    with:
      release_type: ${{ inputs.release_type }}
      merge_environment: ${{ github.ref_protected && 'ci-auto-merge' || '' }}
    secrets: inherit
    
  publishToUID2:
    uses: IABTechLab/uid2-shared-actions/.github/workflows/shared-publish-to-docker-versioned.yaml@v3
    needs: [test, incrementVersionNumber]
    with: 
      new_version: ${{ needs.incrementVersionNumber.outputs.new_version }}
      image_tag: ${{ needs.incrementVersionNumber.outputs.image_tag }}
      release_type: ${{ inputs.release_type }}
      docker_file: Dockerfile_uid2
      docker_image_name: iabtechlab/uid2-tcportal
      docker_registry: ghcr.io
    secrets: inherit

  publishToEUID:
    uses: IABTechLab/uid2-shared-actions/.github/workflows/shared-publish-to-docker-versioned.yaml@v3
    needs: [test, incrementVersionNumber]
    with: 
      new_version: ${{ needs.incrementVersionNumber.outputs.new_version }}
      image_tag: ${{ needs.incrementVersionNumber.outputs.image_tag }}
      release_type: ${{ inputs.release_type }}
      docker_file: Dockerfile_euid
      docker_image_name: iabtechlab/euid-tcportal
      docker_registry: ghcr.io
    secrets: inherit
    
  buildImage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Vulnerability Scan
        uses: IABTechLab/uid2-shared-actions/actions/vulnerability_scan@v3
        with:
          scan_type: 'fs'

